# ============================================================================
#  Gradle 属性
#
#  ★ android.useAndroidX=true 是硬性要求：本工程只用 AndroidX（AppCompat + Material），
#    不引任何 com.android.support 老库。
#  ★ JVM 参数按 Android Studio 模板给（4G 堆 + UTF-8 文件编码）。
#    UTF-8 尤其重要：Kotlin 源码与 strings.xml 里全是中文，
#    用系统默认代码页（本机 936/GBK）读会变乱码。
# ============================================================================
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
